<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>{% block title %}keyswitches4you{% endblock %}</title>

    <!-- CSS -->
    <!-- Bootstrap core CSS -->
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">

    <!-- Additional CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/fontawesome.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/templatemo-sixteen.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/owl.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/images/favicon.ico') }}">
</head>
<body>
  <!-- ***** Preloader Start ***** -->
  <div id="preloader">
    <div class="jumper">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>
  <!-- ***** Preloader End ***** -->

<!-- Header -->
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('ui.home') }}">
                <h2>keyswitches<em>4you</em></h2>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse"
                    data-target="#navbarResponsive" aria-controls="navbarResponsive"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item {% if request.endpoint == 'ui.home' %}active{% endif %}">
                        <a class="nav-link" href="{{ url_for('ui.home') }}">Home</a>
                    </li>
                    <li class="nav-item {% if request.endpoint == 'ui.products' %}active{% endif %}">
                        <a class="nav-link" href="{{ url_for('ui.products') }}">Our Products</a>
                    </li>
                    <li class="nav-item {% if request.endpoint == 'ui.about' %}active{% endif %}">
                        <a class="nav-link" href="{{ url_for('ui.about') }}">About Us</a>
                    </li>
                    <li class="nav-item {% if request.endpoint == 'ui.contact' %}active{% endif %}">
                        <a class="nav-link" href="{{ url_for('ui.contact') }}">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>


<main>
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="inner-content">
                    <p>Copyright &copy; 2020 Sixteen Clothing Co., Ltd.</p>
                </div>
            </div>
        </div>
    </div>
</footer>

<!-- JS -->
<script src="{{ url_for('static', filename='vendor/jquery/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/custom.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/owl.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/slick.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/isotope.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/accordions.js') }}"></script>

</body>
</html>
